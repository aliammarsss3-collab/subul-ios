name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app without signing
        run: |
          xcodebuild -project Subul.xcodeproj -scheme Subul -configuration Release -sdk iphoneos -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R "DerivedData/Build/Products/Release-iphoneos/سُبُل.app" Payload/
          zip -r Subul-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Subul-unsigned-IPA
          path: Subul-unsigned.ipa


